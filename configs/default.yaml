# road-damage-shift — configuration unique du projet.
# Chaque section est lue par un module précis ; les sections marquées (S2), (S3)...
# seront utilisées dans les semaines suivantes mais sont figées dès maintenant
# pour que les choix de protocole soient décidés AVANT de voir les résultats.

project:
  name: road-damage-shift
  seed: 42                      # seed global (découpage, sous-échantillonnage, entraînement)

paths:
  raw_root: data/raw/RDD2022    # dossier contenant les pays extraits (découverte automatique)
  processed_root: data/processed/rdd2022_yolo

data:
  classes: [D00, D10, D20, D40] # ordre = index YOLO (0..3)
  label_aliases: {D0w0: D00}    # 1 boîte India/train, coquille détectée par stats.json
  min_box_px: 2                 # boîte plus petite (en px, après clipping) → ignorée et comptée
  max_side: 1280                # image plus grande → copie redimensionnée ; sinon lien symbolique
  image_mode: symlink           # symlink | copy (pour les images non redimensionnées)
  jpeg_quality: 95
  workers: 8
  countries:
    # role: source = entraînement ; target = pays jamais vu (test + réserve few-shot)
    # max_images: sous-échantillonnage (null = tout le pays)
    Japan:         {role: source, max_images: 3000}
    India:         {role: source, max_images: 3000}
    Czech:         {role: source, max_images: null}   # ~2,8k images annotées
    United_States: {role: target, max_images: 2500}
    Norway:        {role: target, max_images: 2500, required: false}  # zip de 9,9 Go

split:
  # Découpage par blocs d'images consécutives (même trajet probable) pour limiter
  # la fuite train/test entre images voisines. Ce n'est pas une garantie : les
  # métadonnées GPS/séquence ne sont pas publiées.
  block_size: 20
  source: {train: 0.70, val: 0.15, test: 0.15}   # fractions (en nombre d'images)
  target: {test: 1000, pool: rest}               # test figé ; pool = images annotables pour le few-shot
  train_background_keep: 1.0    # fraction d'images sans dégât gardées dans le train source

fewshot:                        # (S2) sous-ensembles imbriqués 50 ⊂ 200 ⊂ 500, tirés dans le pool
  sizes: [50, 200, 500]
  seeds: [0, 1, 2]              # 3 tirages → variance due au choix des images annotées
  # Protocole Q1, fixé AVANT tout résultat few-shot. Aucun réglage n'utilise d'image cible hors des k annotées.
  target: United_States
  include_full_pool: true       # point « plafond » : toute la réserve cible (≈1 500 images), 1 seul tirage
  models: [yolo11s]             # rtdetr_l en option si le quota GPU le permet
  epochs: 30                    # identique pour tous les k ; on évalue last.pt (pas de validation cible pour choisir)
  lr_scale: 0.1                 # lr de fine-tuning = lr d'entraînement S1 / 10 (choix a priori, standard en fine-tuning)
  warmup_bias_lr: 0.0           # défaut Ultralytics 0.1 : trop fort pour repartir d'un modèle déjà entraîné
  nbs: 8                        # = batch : une mise à jour par batch. Avec le défaut (nbs 64, accumulation x8), k=50
                                # ne recevait qu'≈36 mises à jour en 30 epochs (vu dans les logs du smoke, avant tout
                                # résultat few-shot) ; la courbe aurait mesuré ce réglage plutôt que le nombre d'images.
  train_seed: 42                # seed d'entraînement fixe : la variance mesurée vient du choix des images
  evals: [source_val, source_test, test_United_States]  # seuil F1 (val source), oubli (test source), cible
  # S2b (rejeu), fixé après S2 et AVANT tout résultat avec rejeu : seule différence avec S2, l'ajout d'images
  # sources tirées dans le train source (jamais val/test), ratio 1:1 avec les k images cibles, même tirage.
  replay_ratio: 1.0
  annotation_cost:              # modèle publié, PAS une mesure : Su et al. 2012 (ImageNet) ; Papadopoulos et al., ICCV 2017
    s_per_image: 7.8            # vérifier qu'il ne reste aucun objet à annoter dans l'image
    s_per_box_high: 34.5        # tracé classique d'une boîte (25,5 s) + contrôle qualité (9,0 s)
    s_per_box_low: 7.0          # « extreme clicking »

train:
  imgsz: 640
  epochs: 50                    # identique pour les deux modèles
  batch: 8                      # identique ; Ultralytics accumule jusqu'à nbs=64 de toute façon
  patience: 0                   # 0 = pas d'early stopping (Ultralytics) → même budget pour tous
  workers: 4
  deterministic: true
  amp: true
  models:
    yolo11s:  {weights: yolo11s.pt,  arch: yolo}
    # Taux d'apprentissage : recette d'origine de chaque architecture.
    # YOLO11 : "auto" d'Ultralytics (AdamW, lr = 0.002*5/(4+nc) = 0.00125 pour 4 classes).
    # RT-DETR : AdamW lr 1e-4 (Zhao et al., CVPR 2024). Avec "auto" (0.00125) + AMP, l'entraînement
    # complet a divergé (NaN persistant, run interrompu) : la recette YOLO n'est pas adaptée à RT-DETR.
    rtdetr_l: {weights: rtdetr-l.pt, arch: rtdetr, optimizer: AdamW, lr0: 0.0001}  # plus petit RT-DETR d'Ultralytics

mlflow:
  experiment: road-damage-shift
  tracking_uri: null            # null → sqlite local ; sinon URI distante (ex. DagsHub)

eval:
  conf_map: 0.001               # seuil bas pour la mAP (standard)
  iou_match: 0.5                # appariement pour F1 (protocole CRDDC)
  bootstrap: {n_resamples: 1000, ci: 0.95}   # (S1-fin) IC par rééchantillonnage d'images

blur:                           # (S3, Q2) protocole fixé avant tout résultat sur images floutées
  model: yolo11s                # modèle S1 (seed 42) : le meilleur sur la cible, et le candidat au déploiement CPU
  kernel_lengths: [0, 9, 15, 21, 31]   # flou de bougé linéaire, en px (0 = images d'origine, ni flou ni bruit)
  angles_deg: [0, 45, 90]       # un angle tiré par image (seedé par le nom de l'image) : bougé horizontal, oblique, vertical
  noise_sigma: 0.01             # bruit gaussien ajouté après le flou (x 255) : un capteur réel n'est jamais sans bruit
  jpeg_quality: 95              # images floutées réenregistrées en JPEG
  eval_sets: [source_test, test_United_States]
  seed: 42
  wiener_k: 0.01                # rapport bruit/signal du filtre de Wiener, fixé a priori. PSF CONNUE (le noyau exact
                                # utilisé pour flouter) : borne optimiste ; en réel il faudrait estimer le flou.
  train_aug:                    # (c) même recette que S1, en AJOUTANT un flou de bougé aléatoire aux augmentations
    p: 0.5                      #     par défaut d'Ultralytics (Albumentations MotionBlur, longueur 3 à 31 px,
    blur_limit: [3, 31]         #     angle quelconque) : générateur différent de celui du test, mêmes ordres de grandeur.

deploy:                         # (S3, Q3) protocole fixé avant tout résultat de déploiement
  model: yolo11s                # modèle S1 (seed 42), comme pour Q2
  imgsz: 640                    # entrée fixe 1 x 3 x 640 x 640 (ONNX statique)
  onnx_opset: 17
  variants: [pytorch_fp32, onnx_fp32, onnx_int8]
  # Coût de la quantification = onnx_int8 - onnx_fp32 (même prétraitement : image carrée 640x640).
  # pytorch_fp32 est évalué par Ultralytics en mode rectangulaire : image carrée 640 entourée d'une bordure
  # jusqu'à 672x672. L'écart pytorch -> onnx mélange export et entrée, il est rapporté à part.
  int8:                         # onnxruntime quantize_static, format QDQ
    calibration_images: 200     # tirées du TRAIN source (jamais val/test), seed du projet
    calibrate_method: MinMax
    per_channel: true
    op_types: [Conv]            # toutes les convolutions, tête et DFL compris (vérifié sur le modèle : 88/88)
    activation_type: QUInt8
    weight_type: QInt8
  latency:                      # latence du modèle seul (sans pré/post-traitement), batch 1, sur CPU
    threads: 4
    warmup: 20
    runs: 200
  eval_sets: [source_test, test_United_States]
  # Q3b, EXPLORATOIRE : décidé après les résultats de Q3 (perte INT8 de -0,145 aux États-Unis), avant tout résultat
  # Q3b. Plan 2 x 2 : quantifier ou non la tête de détection (model.23 de YOLO11s : 25 Conv, dont DFL) x
  # calibrer sur 200 images sources ou sur 100 sources + 100 américaines NON annotées (réserve few-shot, jamais
  # le test). Le reste = deploy.int8. int8_all_src reproduit Q3 (contrôle).
  int8_variants:
    int8_all_src: {exclude_name_contains: [], calibration: {list_source_train.txt: 200}}
    int8_nohead_src: {exclude_name_contains: ["/model.23/"], calibration: {list_source_train.txt: 200}}
    int8_all_mix:
      exclude_name_contains: []
      calibration: {list_source_train.txt: 100, list_pool_United_States.txt: 100}
    int8_nohead_mix:
      exclude_name_contains: ["/model.23/"]
      calibration: {list_source_train.txt: 100, list_pool_United_States.txt: 100}

zeroshot:
  # Référence sans entraînement (S4). Une phrase par classe, fixée AVANT tout résultat et jamais ajustée sur un
  # jeu de test (vocabulaire RDD2022 / CRDDC). Mêmes jeux et même seuil de F1 (choisi sur source_val) que YOLO.
  prompts: {D00: longitudinal crack, D10: transverse crack, D20: alligator crack, D40: pothole}
  eval_sets: [source_val, source_test, test_United_States]
  reference: yolo11s              # poids S1 seed 42, réévalués dans le même notebook (comparaisons appariées)
  agnostic: true                  # en plus : une seule classe « dégradation », NMS entre classes IoU 0,7
  models:
    grounding_dino:               # Apache-2.0 ; score d'une classe = moyenne des probabilités des tokens
      hf_id: IDEA-Research/grounding-dino-base
      batch: 4
      top_k: 300                  # = max_det d'Ultralytics
      min_score: 0.01
    florence2:                    # MIT ; pas de score par boîte : score de la séquence générée
      hf_id: florence-community/Florence-2-large
      task: "<OPEN_VOCABULARY_DETECTION>"
      batch: 8
      num_beams: 3
      max_new_tokens: 1024
