[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadshift"
version = "0.1.0"
description = "Road damage detection under country shift, motion blur and CPU-only deployment (RDD2022)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
# Dépendances minimales : la conversion et les tests tournent sans GPU ni Ultralytics.
dependencies = ["pillow>=10", "pyyaml>=6", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = ["ultralytics", "mlflow", "pandas", "matplotlib", "onnx>=1.15", "onnxruntime>=1.17", "sympy"]
dev = ["pytest>=8", "ruff>=0.6", "onnx>=1.15", "onnxruntime>=1.17", "sympy", "matplotlib"]

[project.scripts]
roadshift-convert = "roadshift.data.convert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
